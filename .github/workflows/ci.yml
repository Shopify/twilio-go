on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.22.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
    - uses: actions/checkout@v4
      with:
         path: './src/github.com/Shopify/twilio-go'
    # staticcheck needs this for GOPATH
    - run: |
        echo "GOPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
        echo "PATH=$GITHUB_WORKSPACE/bin:$PATH" >> $GITHUB_ENV
    - name: Download dependencies
      run: |
        go get -t -v ./...
        go mod tidy
        go mod verify
      working-directory: './src/github.com/Shopify/twilio-go'
    - name: Verify installation of binaries
      run: |
        go get github.com/kevinburke/differ
        go get github.com/kevinburke/write_mailmap
        go get github.com/kevinburke/bump_version
        go get honnef.co/go/tools/cmd/staticcheck
      working-directory: './src/github.com/Shopify/twilio-go'
    - name: Check for uncommitted changes in go.mod and go.sum
      run: |
        if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
          echo "Untracked or modified files present in go.mod or go.sum after dependency installation:"
          git diff go.mod go.sum
          exit 1
        fi
      working-directory: './src/github.com/Shopify/twilio-go'
    - name: Run `make fmt` and check for changes
      run: |
        make fmt
        if [ -n "$(git status --porcelain)" ]; then
          echo "Untracked or modified files present after running 'make fmt':"
          git diff
          exit 1
        fi
      working-directory: './src/github.com/Shopify/twilio-go'
    - name: Run tests
      run: make ci
      working-directory: './src/github.com/Shopify/twilio-go'
